version: 2.1

executors:
  dummy-executor:
    docker:
      - image: cimg/base:stable
  python-test-executor:
    docker:
      - image: cimg/python:3.12
    resource_class: medium
    environment:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

commands:
  dummy-step:
    steps:
      - run: echo "CI migrated to GitHub Actions. This is a dummy job retained for legacy status compatibility."

jobs:
  python-lint:
    executor: dummy-executor
    steps: [dummy-step]

  # Short-term secondary signal only. GitHub Actions remains the canonical gate
  # and coverage source; CircleCI supplies faster sharded pytest feedback and
  # JUnit timing/failure insights.
  python-test:
    executor: python-test-executor
    parallelism: 2
    steps:
      - checkout
      - restore_cache:
          keys:
            - python-test-v1-{{ checksum "requirements.txt" }}-{{ checksum "requirements-dev.txt" }}
            - python-test-v1-
      - run:
          name: Install Python test dependencies
          command: |
            python -m pip --version
            python -m pip install -r requirements.txt -r requirements-dev.txt
      - save_cache:
          key: python-test-v1-{{ checksum "requirements.txt" }}-{{ checksum "requirements-dev.txt" }}
          paths:
            - ~/.cache/pip
      - run:
          name: Run python-test testsuite
          command: circleci testsuite run "python-test"
      - store_test_results:
          path: test-results/pytest
  python-security:
    executor: dummy-executor
    steps: [dummy-step]
  frontend-lint:
    executor: dummy-executor
    steps: [dummy-step]
  frontend-build:
    executor: dummy-executor
    steps: [dummy-step]
  docker-build:
    executor: dummy-executor
    steps: [dummy-step]

workflows:
  build-and-test:
    jobs:
      - python-lint
      - python-test
      - python-security
      - frontend-lint
      - frontend-build
      - docker-build

apiVersion: 1

providers:
  - name: "FarDB Dashboards"
    orgId: 1
    folder: "FarDB"
    folderUid: "fardb-observability"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false

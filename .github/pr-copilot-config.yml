# Optional local-helper configuration.
# The active workflow does not load this file. Triggers, permissions, and
# read-only status reporting are defined in .github/workflows/pr-copilot.yml.

# Used by .github/pr-copilot/scripts/analyze_pr.py.
scope:
  warn_on_long_title: 72
  max_files_changed: 30
  max_total_changes: 1500
  max_file_types_changed: 5

# Used by .github/pr-copilot/scripts/suggest_fixes.py.
review_handling:
  actionable_keywords:
    - "please"
    - "should"
    - "could you"
    - "nit"
    - "typo"
    - "fix"
    - "refactor"
    - "change"
    - "update"
    - "add"
    - "remove"

name: Frontend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - 'api/api_models.py'
      - 'frontend/app/types/api.ts'
      - 'frontend/__tests__/lib/api-contract-seams.test.ts'
      - '.github/workflows/frontend-ci.yml'
      - '.github/actions/ci-common/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - 'api/api_models.py'
      - 'frontend/app/types/api.ts'
      - 'frontend/__tests__/lib/api-contract-seams.test.ts'
      - '.github/workflows/frontend-ci.yml'
      - '.github/actions/ci-common/**'

permissions:
  contents: read

jobs:
  # Check-run name must stay unique and match docs/ci-required-checks-policy.md (H-P1-04).
  # Job id alone used to report as ambiguous "build".
  frontend-ci:
    permissions:
      contents: read
      id-token: write
    name: frontend-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run frontend CI common
        uses: ./.github/actions/ci-common
        with:
          language: node
          node-version: '22'
          working-directory: frontend
          dependency-paths: frontend/package-lock.json
          install: npm ci
          test: |
            npm run lint
            npm run test:coverage -- --ci
          build: npm run build

      - name: Upload coverage to Qlty
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: qltysh/qlty-action/coverage@56bee2d751c94b7bd8de22f64c9b5f398048e13f # v2.8.1
        with:
          oidc: true
          files: frontend/coverage/lcov.info
          add-prefix: frontend/
          tag: frontend

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-test-results
          path: frontend/junit.xml
          if-no-files-found: warn

name: "Setup JFrog CLI OIDC Example"
on: push

permissions:
  # This is required for requesting the OIDC token
  id-token: write
  # This is required for actions/checkout
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    # Resolve JF_URL once at job scope so steps inherit it without echoing secrets.
    env:
      JF_URL: ${{ vars.JF_URL || secrets.JF_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check JFrog configuration
        id: check-jfrog
        run: |
          if [ -n "$JF_URL" ]; then
            echo "has_jfrog=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_jfrog=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup JFrog CLI
        if: steps.check-jfrog.outputs.has_jfrog == 'true'
        uses: jfrog/setup-jfrog-cli@68c0efdc951dd2359bbbfa15c48bc67b3ae8e4d6 # v5.2.0
        with:
          oidc-provider-name: mohavro/financial-asset-relationship-db@github

      - name: Run JFrog CLI
        if: steps.check-jfrog.outputs.has_jfrog == 'true'
        run: |
          # Ping the server
          jf rt ping

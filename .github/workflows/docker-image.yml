name: Gradio Docker Image CI (non-production)

# EVIDENCE BOUNDARY STATEMENT (H-P1-05):
# Builds the Gradio demo image from the root Dockerfile only.
# Gradio is non-production. Production container proof is production-container.yml.

permissions:
  contents: read

"on":
  push:
    branches: [ "main" ]
    paths:
      - 'Dockerfile'
      - '**/Dockerfile'
      - '**/Dockerfile.*'
      - '**/*.dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - '**/docker-compose*.yml'
      - 'compose.yml'
      - 'compose.yaml'
      - 'docker/**'
      - '.github/workflows/docker-image.yml'
      - '!**/*.md'
      - '!docs/**'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ "main" ]
    paths:
      - 'Dockerfile'
      - '**/Dockerfile'
      - '**/Dockerfile.*'
      - '**/*.dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - '**/docker-compose*.yml'
      - 'compose.yml'
      - 'compose.yaml'
      - 'docker/**'
      - '.github/workflows/docker-image.yml'
      - '!**/*.md'
      - '!docs/**'

concurrency:
  group: docker-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag "my-image-name:$(date +%s)"

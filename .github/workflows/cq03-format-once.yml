name: One-shot CQ-03 documentation format

"on":
  push:
    branches:
      - "codex/cq-03-adr-acceptance-record"
    paths:
      - ".github/workflows/cq03-format-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "codex/cq-03-adr-acceptance-record"
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Format only the flagged documentation and remove this workflow
        run: |
          npx --yes prettier@3.3.3 --write \
            ROADMAP_STATUS.md \
            docs/adr/0009-postgresql-migration-ledger-and-drift-contract.md
          npx --yes prettier@3.3.3 --check \
            ROADMAP_STATUS.md \
            docs/adr/0009-postgresql-migration-ledger-and-drift-contract.md
          git rm .github/workflows/cq03-format-once.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP_STATUS.md docs/adr/0009-postgresql-migration-ledger-and-drift-contract.md
          git commit -m "docs(cq-03): apply pinned markdown formatter"
          git push origin HEAD:codex/cq-03-adr-acceptance-record

name: Codacy isolated compatibility and report observation

# LOCAL PROPOSAL ONLY. No CI or publication authorized by preparation.
# REPORT failure is not waived even if DECODER passes. Not a scanner run or repair.
"on":
  push:
    branches: [codex/codacy-1833-charset-probe]
    paths: [.github/workflows/codacy-charset-probe.yml]

permissions: {}

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Observe distinct decoder, report and exit-policy outcomes
        shell: bash
        env:
          PROBE_IMAGE: codacy/codacy-analysis-cli@sha256:d412b2a84e72d0b541e29dd6cdffa78a73afcf35d8aa546988cd2a44edaab15c
          JAVA_SOURCE: |
            import java.io.BufferedReader;
            import java.io.ByteArrayOutputStream;
            import java.io.PrintStream;
            import java.io.StringReader;
            import java.lang.reflect.Constructor;
            import java.lang.reflect.InvocationTargetException;
            import java.lang.reflect.Method;
            import java.net.URL;
            import java.nio.ByteBuffer;
            import java.nio.charset.Charset;
            import java.nio.charset.CodingErrorAction;
            import java.nio.charset.MalformedInputException;
            import java.nio.charset.StandardCharsets;
            import java.nio.file.Files;
            import java.nio.file.Path;
            import java.nio.file.Paths;
            import java.nio.file.StandardOpenOption;
            import java.security.MessageDigest;
            import java.util.ArrayList;
            import java.util.Arrays;
            import java.util.Collections;
            import java.util.Enumeration;
            import java.util.LinkedHashMap;
            import java.util.List;
            import java.util.Map;

            /** Preparation-only source: no scanner invocation or repair acceptance. */
            public final class CompatibilityProbe {
                private static final Path INPUT = Paths.get("/probe");
                private static final Path SCRATCH = Paths.get("/scratch");
                private static final Path LIBRARY = INPUT.resolve("better-files_2.12-3.9.2.jar");
                private static final String LIBRARY_HASH =
                    "65fc3f2e622d23d0e574f6b526a868e62b2e8d79d8b286018d7db3aa69244cff";
                private static final String[] NAMES = {
                    "ARCHITECTURE.md", "TEST_GENERATION_CURRENT_BRANCH_SUMMARY.md", "tech_spec.md"
                };
                private static final long[] SIZES = {21474L, 10387L, 579135L};
                private static final String[] HASHES = {
                    "524cc09849f99b6e603f229d2abbef2f8783d9929c1eb7172becc407307aaeac",
                    "f8b55c887c12461fa0c8135b155d8e2b566f2660c5ca6a9d9b47e443e9dbe052",
                    "f5edfdcc78f272fab6398b2cba88b56a7aadeb4639372c4b92c3d82bea8e889d"
                };
                private static final int[] LINES = {72, 225, 428};
                private static final String[] IDS = {"PROBE_SECURITY", "PROBE_STYLE"};
                // Independently computed from immutable blobs; existing MD5 compatibility, not security hashes.
                private static final String[][] FINGERPRINTS = {
                    {"253e6cc072076684e3bfe42810062636", "eb180a858145a555e7f5bf537824bb2c"},
                    {"79f4d51fefa75a68778db019be0a37f9", "a830f5226f0477cf34cd2206dc156908"},
                    {"684fd56bf001dd98452c50f58f7fa121", "db628a6ad3e6c8d753e69b10f213bfa0"}
                };
                private static final String[] CATEGORIES = {"Security", "CodeStyle"};
                private static final List<String> FAILURES = new ArrayList<String>();

                private CompatibilityProbe() {}

                private interface Check {
                    void run() throws Exception;
                }

                private static void require(boolean condition, String message) {
                    if (!condition) {
                        throw new IllegalStateException(message);
                    }
                }

                private static void lane(String name, Check check) {
                    try {
                        check.run();
                        System.out.println("OUTCOME\t" + name + "\tPASS");
                    } catch (Exception | LinkageError error) {
                        FAILURES.add(name);
                        System.out.println("OUTCOME\t" + name + "\tFAIL\t" + error);
                    }
                }

                private static Class<?> type(String name) throws ClassNotFoundException {
                    return Class.forName(name);
                }

                private static Object module(String name) throws Exception {
                    return type(name).getField("MODULE$").get(null);
                }

                private static boolean accepts(Class<?>[] parameters, Object[] arguments) {
                    if (parameters.length != arguments.length) {
                        return false;
                    }
                    for (int i = 0; i < parameters.length; i++) {
                        Class<?> parameter = parameters[i];
                        if (parameter == int.class) {
                            parameter = Integer.class;
                        } else if (parameter == boolean.class) {
                            parameter = Boolean.class;
                        }
                        if (arguments[i] == null || !parameter.isInstance(arguments[i])) {
                            return false;
                        }
                    }
                    return true;
                }

                private static Object invoke(Method method, Object target, Object[] arguments) throws Exception {
                    try {
                        return method.invoke(target, arguments);
                    } catch (InvocationTargetException error) {
                        Throwable cause = error.getCause();
                        if (cause instanceof Exception) {
                            throw (Exception) cause;
                        }
                        if (cause instanceof Error) {
                            throw (Error) cause;
                        }
                        throw error;
                    }
                }

                private static Object call(Object target, String owner, String name, Object... arguments) throws Exception {
                    List<Method> matches = new ArrayList<Method>();
                    for (Method method : type(owner).getMethods()) {
                        if (method.getName().equals(name) && !method.isBridge() && !method.isSynthetic()
                            && accepts(method.getParameterTypes(), arguments)) {
                            matches.add(method);
                        }
                    }
                    require(matches.size() == 1, "Missing/ambiguous method: " + owner + "." + name);
                    return invoke(matches.get(0), target, arguments);
                }

                private static Object construct(String name, Object... arguments) throws Exception {
                    List<Constructor<?>> matches = new ArrayList<Constructor<?>>();
                    for (Constructor<?> constructor : type(name).getConstructors()) {
                        if (!constructor.isSynthetic() && accepts(constructor.getParameterTypes(), arguments)) {
                            matches.add(constructor);
                        }
                    }
                    require(matches.size() == 1, "Missing/ambiguous constructor: " + name);
                    try {
                        return matches.get(0).newInstance(arguments);
                    } catch (InvocationTargetException error) {
                        Throwable cause = error.getCause();
                        if (cause instanceof Exception) {
                            throw (Exception) cause;
                        }
                        if (cause instanceof Error) {
                            throw (Error) cause;
                        }
                        throw error;
                    }
                }

                private static Object none() throws Exception {
                    return module("scala.None$");
                }

                private static Object some(Object value) throws Exception {
                    return construct("scala.Some", value);
                }

                private static Object scalaList(Object... values) throws Exception {
                    Object list = module("scala.collection.immutable.Nil$");
                    for (int i = values.length - 1; i >= 0; i--) {
                        list = construct("scala.collection.immutable.$colon$colon", values[i], list);
                    }
                    return list;
                }

                private static Object scalaSet(Object... values) throws Exception {
                    return call(scalaList(values), "scala.collection.immutable.List", "toSet");
                }

                private static Object enumValue(String name, String value) throws Exception {
                    return call(module(name), "scala.Enumeration", "withName", value);
                }

                private static String sha256(byte[] bytes) throws Exception {
                    byte[] digest = MessageDigest.getInstance("SHA-256").digest(bytes);
                    StringBuilder text = new StringBuilder();
                    for (byte value : digest) {
                        text.append(String.format("%02x", value & 255));
                    }
                    return text.toString();
                }

                private static byte[] verified(Path file, long size, String digest) throws Exception {
                    require(!Files.isSymbolicLink(file) && Files.isRegularFile(file), "Invalid input type: " + file);
                    require(Files.size(file) == size, "Input size: " + file);
                    byte[] bytes = Files.readAllBytes(file);
                    require(bytes.length == size && sha256(bytes).equals(digest), "Input identity: " + file);
                    return bytes;
                }

                private static void libraryClass(String name) throws Exception {
                    Class<?> clazz = type(name);
                    Path source = Paths.get(clazz.getProtectionDomain().getCodeSource().getLocation().toURI());
                    require(source.equals(LIBRARY), "Unexpected class origin: " + name + " " + source);
                    Enumeration<URL> resources = clazz.getClassLoader().getResources(name.replace('.', '/') + ".class");
                    List<URL> origins = Collections.list(resources);
                    require(origins.size() == 1, "Ambiguous class resources: " + name);
                }

                private static Charset candidateCharset() throws Exception {
                    verified(LIBRARY, 263930L, LIBRARY_HASH);
                    for (String name : new String[] {"better.files.package$", "better.files.File", "better.files.File$",
                        "better.files.UnicodeCharset", "better.files.UnicodeDecoder"}) {
                        libraryClass(name);
                    }
                    Object value = call(module("better.files.package$"), "better.files.package$", "DefaultCharset");
                    require(value instanceof Charset, "Unexpected charset result");
                    Charset charset = (Charset) value;
                    require(charset.name().equals("UTF-8")
                        && charset.getClass().getName().equals("better.files.UnicodeCharset"), "Unexpected charset");
                    require(charset.newDecoder().getClass().getName().equals("better.files.UnicodeDecoder"), "Decoder class");
                    System.out.println("LIBRARY\t" + LIBRARY + "\tsha256=" + LIBRARY_HASH);
                    return charset;
                }

                private static List<String> lines(String text) throws Exception {
                    List<String> result = new ArrayList<String>();
                    try (BufferedReader reader = new BufferedReader(new StringReader(text))) {
                        String line;
                        while ((line = reader.readLine()) != null) {
                            result.add(line);
                        }
                    }
                    return result;
                }

                private static List<String> oracle(byte[] bytes) throws Exception {
                    return lines(StandardCharsets.UTF_8.newDecoder().onMalformedInput(CodingErrorAction.REPORT)
                        .onUnmappableCharacter(CodingErrorAction.REPORT).decode(ByteBuffer.wrap(bytes)).toString());
                }

                private static void valid(Path path, Charset charset) throws Exception {
                    List<String> expected = oracle(Files.readAllBytes(path));
                    require(Files.readAllLines(path, StandardCharsets.UTF_8).equals(expected), "Native disagreement: " + path);
                    require(Files.readAllLines(path, charset).equals(expected), "Candidate disagreement: " + path);
                    System.out.println("DECODER_VALID\t" + path.getFileName() + "\tEXACT_LINES");
                }

                private static void invalid(Path path, Charset charset) throws Exception {
                    int rejected = 0;
                    try {
                        oracle(Files.readAllBytes(path));
                    } catch (MalformedInputException error) {
                        rejected++;
                    }
                    for (Charset decoder : new Charset[] {StandardCharsets.UTF_8, charset}) {
                        try {
                            Files.readAllLines(path, decoder);
                        } catch (MalformedInputException error) {
                            rejected++;
                        }
                    }
                    require(rejected == 3, "Malformed input accepted: " + path);
                    System.out.println("DECODER_INVALID\t" + path.getFileName() + "\tALL_REJECTED");
                }

                private static Path fixture(String name, int prefix, int... tail) throws Exception {
                    byte[] bytes = new byte[prefix + tail.length];
                    Arrays.fill(bytes, 0, prefix, (byte) 'a');
                    for (int i = 0; i < tail.length; i++) {
                        bytes[prefix + i] = (byte) tail[i];
                    }
                    Path path = SCRATCH.resolve(name);
                    Files.write(path, bytes, StandardOpenOption.CREATE_NEW, StandardOpenOption.WRITE);
                    return path;
                }

                private static void decoderChecks() throws Exception {
                    Charset charset = candidateCharset();
                    for (int i = 0; i < NAMES.length; i++) {
                        Path path = INPUT.resolve(NAMES[i]);
                        verified(path, SIZES[i], HASHES[i]);
                        valid(path, charset);
                        verified(path, SIZES[i], HASHES[i]);
                    }
                    valid(fixture("ascii", 8200), charset);
                    valid(fixture("aligned-three", 8189, 0xe2, 0x94, 0x80, 10), charset);
                    valid(fixture("shifted-three", 8192, 0xe2, 0x94, 0x80, 10), charset);
                    valid(fixture("split-three", 8190, 0xe2, 0x94, 0x80, 10), charset);
                    valid(fixture("split-four", 8190, 0xf0, 0x9f, 0x98, 0x80, 10), charset);
                    valid(fixture("empty-eof", 0), charset);
                    valid(fixture("no-final-newline", 0, 0xe2, 0x94, 0x80), charset);
                    Path endings = fixture("mixed-line-endings", 0, 97, 13, 10, 98, 13, 99, 10, 10, 100);
                    require(oracle(Files.readAllBytes(endings)).equals(Arrays.asList("a", "b", "c", "", "d")), "Line oracle");
                    valid(endings, charset);
                    // JDK readAllLines initially supplies an empty buffer: this seam retains the UTF-8 BOM.
                    Path bom = fixture("utf8-bom-stream", 0, 0xef, 0xbb, 0xbf, 97, 10);
                    require(Files.readAllLines(bom, charset).equals(Arrays.asList("\ufeffa")), "Streaming BOM expectation");
                    valid(bom, charset);
                    // A nonempty whole-buffer decoder call deliberately consumes the initial BOM instead.
                    require(charset.newDecoder().decode(ByteBuffer.wrap(Files.readAllBytes(bom))).toString().equals("a\n"),
                        "Whole-buffer UTF-8 BOM expectation");
                    require(charset.newDecoder().decode(ByteBuffer.wrap(new byte[] {(byte) 0xff, (byte) 0xfe, 97, 0}))
                        .toString().equals("a"), "Whole-buffer UTF-16LE BOM expectation");
                    require(charset.newDecoder().decode(ByteBuffer.wrap(new byte[] {(byte) 0xfe, (byte) 0xff, 0, 97}))
                        .toString().equals("a"), "Whole-buffer UTF-16BE BOM expectation");
                    invalid(fixture("invalid-continuation", 0, 0xe2, 0x94, 65), charset);
                    invalid(fixture("truncated-eof", 0, 0xe2, 0x94), charset);
                    invalid(fixture("truncated-boundary", 8190, 0xe2, 0x94), charset);
                }

                private static Map<String, Object> object(Object... pairs) {
                    require(pairs.length % 2 == 0, "Object pair count");
                    Map<String, Object> result = new LinkedHashMap<String, Object>();
                    for (int i = 0; i < pairs.length; i += 2) {
                        String key = (String) pairs[i];
                        require(!result.containsKey(key), "Duplicate expected key");
                        result.put(key, pairs[i + 1]);
                    }
                    return result;
                }

                private static List<Object> list(Object... values) {
                    return Arrays.asList(values);
                }

                private static Object pattern(int index) throws Exception {
                    return construct("com.codacy.plugins.api.results.Pattern$Specification", IDS[index],
                        enumValue("com.codacy.plugins.api.results.Result$Level$", "Error"),
                        enumValue("com.codacy.plugins.api.results.Pattern$Category$", CATEGORIES[index]),
                        none(), none(), scalaSet(), scalaSet(), false);
                }

                private static Object description(int index) throws Exception {
                    return construct("com.codacy.plugins.api.PatternDescription", IDS[index], IDS[index] + " title",
                        none(), some(IDS[index] + " description"), none(), none());
                }

                private static Object issue(int file, int category) throws Exception {
                    return construct("com.codacy.analysis.core.model.Issue", IDS[category], Paths.get(NAMES[file]),
                        IDS[category] + " message", enumValue("com.codacy.plugins.api.results.Result$Level$", "Error"),
                        some(enumValue("com.codacy.plugins.api.results.Pattern$Category$", CATEGORIES[category])),
                        construct("com.codacy.analysis.core.model.LineLocation", LINES[file]), none());
                }

                private static Object expectedReport(int file) {
                    List<Object> rules = new ArrayList<Object>();
                    List<Object> results = new ArrayList<Object>();
                    for (int category = 0; category < IDS.length; category++) {
                        rules.add(object("id", IDS[category], "name", IDS[category] + " title",
                            "shortDescription", object("text", IDS[category] + " description"),
                            "help", object("text", IDS[category] + " description"),
                            "properties", object("category", CATEGORIES[category])));
                        results.add(object("ruleIndex", category, "ruleId", IDS[category],
                            "message", object("text", IDS[category] + " message"),
                            "level", category == 0 ? "error" : "warning",
                            "locations", list(object("physicalLocation", object(
                                "artifactLocation", object("index", 0, "uri", NAMES[file]),
                                "region", object("startLine", LINES[file], "startColumn", 1)))),
                            "partialFingerprints", object("primaryLocationStartColumnFingerprint", "1",
                                "primaryLocationLineHash", FINGERPRINTS[file][category])));
                    }
                    return object("$schema", "https://docs.oasis-open.org/sarif/sarif/v2.1.0/cos02/schemas/sarif-schema-2.1.0.json",
                        "version", "2.1.0", "runs", list(object("tool", object("driver", object(
                            "name", "Compatibility probe (reported by Codacy)", "version", "1.0.0",
                            "informationUri", "https://www.codacy.com", "rules", rules)), "results", results,
                            "invocations", list(object("executionSuccessful", true,
                                "workingDirectory", object("uri", "file:///codacy"))),
                            "artifacts", list(object("location", object("uri", NAMES[file]))))));
                }

                private static void reportCheck(int file) throws Exception {
                    verified(INPUT.resolve(NAMES[file]), SIZES[file], HASHES[file]);
                    Object directory = call(module("better.files.File$"), "better.files.File$", "apply", INPUT);
                    Object tool = construct("com.codacy.plugins.api.results.Tool$Specification", "Compatibility probe",
                        some(construct("com.codacy.plugins.api.results.Tool$Version", "1.0.0")),
                        scalaSet(pattern(0), pattern(1)));
                    ByteArrayOutputStream bytes = new ByteArrayOutputStream();
                    try (PrintStream stream = new PrintStream(bytes, false, "UTF-8")) {
                        Object formatter = call(module("com.codacy.analysis.cli.formatter.Sarif$"),
                            "com.codacy.analysis.cli.formatter.Sarif$", "apply", stream, directory, true);
                        String owner = "com.codacy.analysis.cli.formatter.Formatter";
                        call(formatter, owner, "begin");
                        call(formatter, owner, "addAll", some(tool), scalaSet(description(0), description(1)),
                            none(), scalaList(issue(file, 0), issue(file, 1)));
                        call(formatter, owner, "end");
                    }
                    require(bytes.size() > 0 && bytes.size() < 65536, "Unexpected report size");
                    String json = StandardCharsets.UTF_8.newDecoder().onMalformedInput(CodingErrorAction.REPORT)
                        .decode(ByteBuffer.wrap(bytes.toByteArray())).toString();
                    Object mapper = construct("com.fasterxml.jackson.databind.ObjectMapper");
                    call(mapper, "com.fasterxml.jackson.databind.ObjectMapper", "configure",
                        type("com.fasterxml.jackson.core.JsonParser$Feature").getField("STRICT_DUPLICATE_DETECTION").get(null), true);
                    call(mapper, "com.fasterxml.jackson.databind.ObjectMapper", "configure",
                        type("com.fasterxml.jackson.databind.DeserializationFeature").getField("FAIL_ON_TRAILING_TOKENS").get(null), true);
                    Object parsed = call(mapper, "com.fasterxml.jackson.databind.ObjectMapper", "readValue", json, Map.class);
                    require(parsed instanceof Map, "Report is not a JSON object");
                    System.out.println("SYNTHETIC_SARIF\t" + NAMES[file] + "\t" + json);
                    // A legacy style ruleIndex=0 is a correctness failure, never an accepted compatibility oracle.
                    require(expectedReport(file).equals(parsed), "Report content/rule-index relation mismatch: " + NAMES[file]);
                    verified(INPUT.resolve(NAMES[file]), SIZES[file], HASHES[file]);
                }

                private static void reportChecks() throws Exception {
                    candidateCharset();
                    List<String> failed = new ArrayList<String>();
                    for (int file = 0; file < NAMES.length; file++) {
                        try {
                            reportCheck(file);
                            System.out.println("REPORT_FIXTURE\t" + NAMES[file] + "\tPASS");
                        } catch (Exception | LinkageError error) {
                            failed.add(NAMES[file]);
                            System.out.println("REPORT_FIXTURE\t" + NAMES[file] + "\tFAIL\t" + error);
                        }
                    }
                    require(failed.isEmpty(), "Report fixtures failed: " + failed);
                }

                private static Object toolResult(Object attempt) throws Exception {
                    return construct("com.codacy.analysis.cli.analysis.AnalyseExecutor$IssuesToolExecutorResult",
                        "Synthetic probe", none(), scalaSet(), none(), scalaSet(), attempt);
                }

                private static void exitCase(String name, Object policy, Object either, int expected) throws Exception {
                    Object actual = call(policy, "com.codacy.analysis.cli.analysis.ExitStatus", "exitCode", either);
                    require(actual instanceof Integer && ((Integer) actual).intValue() == expected, "Exit policy: " + name);
                    System.out.println("EXIT_CASE\t" + name + "\t" + actual);
                }

                private static void exitChecks() throws Exception {
                    Object policy = construct("com.codacy.analysis.cli.analysis.ExitStatus", Integer.MAX_VALUE, true);
                    Object success = toolResult(construct("scala.util.Success", scalaSet(issue(0, 0), issue(0, 1))));
                    Object failedAttempt = construct("scala.util.Failure", new Exception("Synthetic tool failure"));
                    Object failure = toolResult(failedAttempt);
                    exitCase("complete", policy, construct("scala.util.Right", scalaList(success)), 0);
                    exitCase("partial", policy, construct("scala.util.Right", scalaList(success, failure)), 101);
                    exitCase("all-tools-failed", policy, construct("scala.util.Right", scalaList(failure)), 101);
                    Object metricsFailure = construct("com.codacy.analysis.cli.analysis.AnalyseExecutor$MetricsToolExecutorResult",
                        "Synthetic language", scalaSet(), failedAttempt);
                    Object duplicationFailure = construct("com.codacy.analysis.cli.analysis.AnalyseExecutor$DuplicationToolExecutorResult",
                        "Synthetic language", scalaSet(), failedAttempt);
                    exitCase("metrics-failure", policy, construct("scala.util.Right", scalaList(success, metricsFailure)), 101);
                    exitCase("duplication-failure", policy, construct("scala.util.Right", scalaList(success, duplicationFailure)), 101);
                    exitCase("analysis-left", policy, construct("scala.util.Left",
                        module("com.codacy.analysis.cli.CLIError$FilesAccessError$")), 100);
                    exitCase("threshold", construct("com.codacy.analysis.cli.analysis.ExitStatus", 0, true),
                        construct("scala.util.Right", scalaList(success)), 102);
                }

                public static void main(String[] arguments) throws Exception {
                    require(arguments.length == 0, "No external arguments");
                    require(System.getProperty("java.version").equals("1.8.0_452"), "Unexpected runtime");
                    require(Charset.defaultCharset().equals(StandardCharsets.UTF_8), "Unexpected default charset");
                    require(Files.isDirectory(INPUT) && Files.isDirectory(SCRATCH), "Missing bounded directories");
                    System.out.println("RUNTIME\t" + System.getProperty("java.version") + "\t" + Charset.defaultCharset());
                    lane("DECODER", new Check() {
                        public void run() throws Exception { decoderChecks(); }
                    });
                    lane("REPORT", new Check() {
                        public void run() throws Exception { reportChecks(); }
                    });
                    lane("EXIT_POLICY", new Check() {
                        public void run() throws Exception { exitChecks(); }
                    });
                    System.out.println("NOT_A_SCANNER_PASS\tfailedSections=" + FAILURES);
                    require(FAILURES.isEmpty(), "Compatibility/report diagnostic failed: " + FAILURES);
                }
            }
        run: |
          set -euo pipefail
          owned_name=''
          cleanup() {
            local outcome=$?
            trap - EXIT
            if [[ -n "$owned_name" ]]; then
              if ! timeout --kill-after=1s 5s docker rm --force "$owned_name"; then
                outcome=1
              fi
            fi
            exit "$outcome"
          }
          trap cleanup EXIT
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          [[ -n "$RUNNER_TEMP" && "$RUNNER_TEMP" == /* && -d "$RUNNER_TEMP" ]]
          [[ -n "$JAVA_HOME_17_X64" && -x "$JAVA_HOME_17_X64/bin/javac" ]]
          probe_dir=$(mktemp -d "$RUNNER_TEMP/codacy-compat.XXXXXX")
          [[ "$probe_dir" == "$RUNNER_TEMP"/codacy-compat.* && "$probe_dir" != *,* ]]
          mkdir "$probe_dir/classes"
          printf '%s' "$JAVA_SOURCE" > "$probe_dir/CompatibilityProbe.java"
          for file in ARCHITECTURE.md TEST_GENERATION_CURRENT_BRANCH_SUMMARY.md tech_spec.md; do
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
              --connect-timeout 5 --max-time 15 --max-filesize 600000 \
              --output "$probe_dir/$file" \
              "https://raw.githubusercontent.com/DashFin-FarDb/financial-asset-relationship-db/4e687329c2216e7e4b4fe4b6a8c36a5ed02f3de7/$file"
          done
          (
            cd "$probe_dir"
            printf '%s\n' \
              '524cc09849f99b6e603f229d2abbef2f8783d9929c1eb7172becc407307aaeac  ARCHITECTURE.md' \
              'f8b55c887c12461fa0c8135b155d8e2b566f2660c5ca6a9d9b47e443e9dbe052  TEST_GENERATION_CURRENT_BRANCH_SUMMARY.md' \
              'f5edfdcc78f272fab6398b2cba88b56a7aadeb4639372c4b92c3d82bea8e889d  tech_spec.md' |
              sha256sum --check --strict
            [[ $(wc -c < ARCHITECTURE.md) == 21474 ]]
            [[ $(wc -c < TEST_GENERATION_CURRENT_BRANCH_SUMMARY.md) == 10387 ]]
            [[ $(wc -c < tech_spec.md) == 579135 ]]
          )
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \

name: Python Package using Conda

permissions:
  contents: read

"on":
  push:
    branches: [ "main" ]
    paths:
      - 'environment.yml'
      - '.github/workflows/python-package-conda.yml'
      - '!**/*.md'
      - '!docs/**'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ "main" ]
    paths:
      - 'environment.yml'
      - '.github/workflows/python-package-conda.yml'
      - '!**/*.md'
      - '!docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Check for environment.yml
      id: conda_env
      run: |
        if [ -f environment.yml ]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
          echo "environment.yml not present; skipping conda job steps."
        fi
    - name: Set up Python 3.10
      if: steps.conda_env.outputs.present == 'true'

      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.10'
    - name: Add conda to system path
      if: steps.conda_env.outputs.present == 'true'
      run: |
        # $CONDA is an environment variable pointing to the root of the miniconda directory
        echo "$CONDA/bin" >> "$GITHUB_PATH"
    - name: Install dependencies
      if: steps.conda_env.outputs.present == 'true'
      run: |
        conda env update --file environment.yml --name base
    - name: Lint with flake8
      if: steps.conda_env.outputs.present == 'true'
      run: |
        conda install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings; use the repository's canonical line length.
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
    - name: Test with pytest
      if: steps.conda_env.outputs.present == 'true'
      run: |
        conda install pytest
        pytest

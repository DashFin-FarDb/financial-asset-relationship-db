name: Python CI

"on":
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # ------------------------------------------------------------
      # Caching Layers (Batch 11)
      # ------------------------------------------------------------
      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ matrix.python-version }}-
            pip-${{ runner.os }}-

      - name: Cache ruff
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ruff
          key: ruff-${{ runner.os }}

      - name: Cache mypy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/*.py') }}

      - name: Cache pytest cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pytest_cache
          key: pytest-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/*.py') }}

      # ------------------------------------------------------------
      # Install + Lint + Type Check + Tests
      # ------------------------------------------------------------
      - name: Run CI common for Python ${{ matrix.python-version }}
        uses: ./.github/actions/ci-common
        with:
          language: python
          python-version: ${{ matrix.python-version }}
          dependency-paths: |
            requirements.txt
            requirements-dev.txt
          install: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            pip install -r requirements-dev.txt
          test: |
            echo "===== Lint: Ruff ====="
            ruff check .

            echo "===== Lint: Flake8 (critical) ====="
            flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

            echo "===== Lint: Flake8 (general) ====="
            flake8 . --count --statistics

            echo "===== Formatting: Black ====="
            black --check --diff .

            echo "===== Import Order: isort ====="
            isort --check-only --diff .

            echo "===== Type Checking: mypy ====="
            mypy src --pretty --show-error-codes

            echo "===== Lint: Pylint ====="
            pylint src/ --fail-under=7.0

            echo "===== Tests + Coverage ====="
            pip check
            pytest --cov=src --cov-report=xml --cov-report=term-missing -v

      - name: GRAC v1 conformance
        run: python tools/ci/check_relationship_assertion_contract.py

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
        continue-on-error: true

  postgres-ledger-profiles:
    name: PostgreSQL ledger profiles (${{ matrix.postgres-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres-version: [15, 16]

    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d test_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Setup pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.114.0

      - name: Install dependencies
        # pip lives in scripts/ci_install_python_deps.sh (avoids githubactions:S8544 on -r installs).
        run: bash scripts/ci_install_python_deps.sh

      - name: Validate exact component ledger bytes
        run: python -m scripts.postgresql_ledger validate

      - name: Build every profile twice and prove drift, relationship, and authority contracts
        env:
          FARDB_EPHEMERAL_POSTGRES_LEDGER_TESTS: "1"
          FARDB_EPHEMERAL_POSTGRES_URL: postgresql://test:test@127.0.0.1:5432/test_db?sslmode=disable
          SECRET_KEY: ci-grac-schema-test-key-not-a-real-secret
          DATABASE_URL: sqlite:///./ci-auth.db
        run: pytest tests/integration/test_postgresql_ledger_profiles.py -v -rs

  postgres-ledger-container-boundary:
    name: PostgreSQL ledger container boundary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build runtime image without migration authority
        run: |
          docker build --target runtime --tag fardb-runtime:test --file Dockerfile.api .
          docker run --rm --entrypoint sh fardb-runtime:test -c \
            'test ! -e /app/supabase && test ! -e /app/scripts/postgresql_ledger.py && test ! -e /usr/local/bin/supabase'

      - name: Build pinned operator image with exact ledger
        run: |
          docker build --target migration --tag fardb-migration:test --file Dockerfile.api .
          docker run --rm --entrypoint sh fardb-migration:test -c \
            'test "$(supabase --version)" = "2.114.0" && python -m scripts.postgresql_ledger validate'

  security:
    name: Security checks
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run CI common for security checks (Python 3.11)
        uses: ./.github/actions/ci-common
        with:
          language: python
          python-version: "3.11"
          dependency-paths: |
            requirements.txt
            requirements-ci-security.txt
          install: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            # Freeze resolved runtime packages (direct + transitive) before
            # installing CI security tooling, so Safety can scan the installed
            # runtime set without also covering safety/bandit toolchains.
            pip freeze > .ci-runtime-freeze.txt
            # Keep the scanners in an isolated environment so their transitive
            # dependencies cannot collide with the installed runtime set.
            python -m venv "$RUNNER_TEMP/fardb-security-venv"
            "$RUNNER_TEMP/fardb-security-venv/bin/python" -m pip install \
              --require-hashes -r requirements-ci-security.txt
          test: |
            echo "===== Safety ====="
            "$RUNNER_TEMP/fardb-security-venv/bin/safety" \
              check -r .ci-runtime-freeze.txt --policy-file .safety-policy.json --json

            echo "===== Bandit ====="
            "$RUNNER_TEMP/fardb-security-venv/bin/bandit" -r src/ -ll

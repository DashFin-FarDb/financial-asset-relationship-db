name: Python CI

"on":
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      # ------------------------------------------------------------
      # Caching Layers (Batch 11)
      # ------------------------------------------------------------
      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ matrix.python-version }}-
            pip-${{ runner.os }}-

      - name: Cache ruff
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ruff
          key: ruff-${{ runner.os }}

      - name: Cache mypy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/*.py') }}

      - name: Cache pytest cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pytest_cache
          key: pytest-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/*.py') }}

      # ------------------------------------------------------------
      # Install + Lint + Type Check + Tests
      # ------------------------------------------------------------
      - name: Run CI common for Python ${{ matrix.python-version }}
        uses: ./.github/actions/ci-common
        with:
          language: python
          python-version: ${{ matrix.python-version }}
          dependency-paths: |
            requirements.txt
            requirements-dev.txt
          install: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            pip install -r requirements-dev.txt
          test: |
            echo "===== Lint: Ruff ====="
            ruff check .

            echo "===== Lint: Flake8 (critical) ====="
            flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

            echo "===== Lint: Flake8 (general) ====="
            flake8 . --count --statistics

            echo "===== Formatting: Black ====="
            black --check --diff .

            echo "===== Import Order: isort ====="
            isort --check-only --diff .

            echo "===== Type Checking: mypy ====="
            mypy src --pretty --show-error-codes

            echo "===== Lint: Pylint ====="
            pylint src/ --fail-under=7.0

            echo "===== Tests + Coverage ====="
            pip check
            pytest --cov=src --cov-report=xml --cov-report=term-missing -v

      - name: GRAC v1 conformance
        run: python tools/ci/check_relationship_assertion_contract.py

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
        continue-on-error: true

  grac-assertion-schema-postgres:
    name: GRAC assertion schema (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d test_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run GRAC assertion schema tests against ephemeral Postgres
        env:
          ASSET_GRAPH_DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          SECRET_KEY: test-secret-key-at-least-32-bytes-long
          DATABASE_URL: sqlite:///./ci-auth.db
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: changeme
        run: |
          pytest tests/unit/test_relationship_assertion_db_models.py \
            tests/integration/test_relationship_assertion_schema.py -v

  security:
    name: Security checks
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run CI common for security checks (Python 3.11)
        uses: ./.github/actions/ci-common
        with:
          language: python
          python-version: "3.11"
          dependency-paths: |
            requirements.txt
          install: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            # Freeze resolved runtime packages (direct + transitive) before
            # installing CI security tooling, so Safety can scan the installed
            # runtime set without also covering safety/bandit toolchains.
            pip freeze > .ci-runtime-freeze.txt
            pip install safety bandit
          test: |
            echo "===== Safety ====="
            safety check -r .ci-runtime-freeze.txt --policy-file .safety-policy.json --json

            echo "===== Bandit ====="
            bandit -r src/ -ll

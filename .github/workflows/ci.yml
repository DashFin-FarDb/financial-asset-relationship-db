name: Python CI

"on":
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # ------------------------------------------------------------
      # Caching Layers (Batch 11)
      # ------------------------------------------------------------
      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ matrix.python-version }}-
            pip-${{ runner.os }}-

      - name: Cache ruff
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ruff
          key: ruff-${{ runner.os }}

      - name: Cache mypy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/*.py') }}

      - name: Cache pytest cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pytest_cache
          key: pytest-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/*.py') }}

      # ------------------------------------------------------------
      # Install + Lint + Type Check + Tests
      # ------------------------------------------------------------
      - name: Run CI common for Python ${{ matrix.python-version }}
        uses: ./.github/actions/ci-common
        with:
          language: python
          python-version: ${{ matrix.python-version }}
          dependency-paths: |
            requirements.txt
            requirements-dev.txt
          install: |
            python -m pip --version
            pip install -r requirements.txt
            pip install -r requirements-dev.txt
          test: |
            echo "===== Lint: Ruff ====="
            ruff check .

            echo "===== Lint: Flake8 (critical) ====="
            flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

            echo "===== Lint: Flake8 (general) ====="
            flake8 . --count --statistics

            echo "===== Formatting: Black ====="
            black --check --diff .

            echo "===== Import Order: isort ====="
            isort --check-only --diff .

            echo "===== Type Checking: mypy ====="
            mypy src --pretty --show-error-codes

            echo "===== Lint: Pylint ====="
            pylint src/ --fail-under=7.0

            echo "===== Tests + Coverage ====="
            pip check
            pytest --cov=src --cov-report=xml --cov-report=term-missing -v

      - name: GRAC v1 conformance
        run: python tools/ci/check_relationship_assertion_contract.py

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
        continue-on-error: true

  postgres-ledger-profiles:
    name: PostgreSQL ledger profiles (${{ matrix.postgres-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres-version: [15, 16]

    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --publish=127.0.0.1:5432:5432
          --health-cmd="pg_isready -U test -d test_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Setup pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.114.0

      - name: Install dependencies
        # Wheel-only requirements installs live in this helper (avoids githubactions:S8544 on -r installs).
        run: bash scripts/ci_install_python_deps.sh

      - name: Validate exact component ledger bytes
        run: python -m scripts.postgresql_ledger validate

      - name: Attest this job's PostgreSQL service and data directory
        env:
          PG_SERVICE_ID: ${{ job.services.postgres.id }}
          PG_SERVICE_IMAGE: postgres:${{ matrix.postgres-version }}
        run: |
          set -euo pipefail
          test -n "$PG_SERVICE_ID"
          running_ids="$(docker ps --no-trunc --filter "id=$PG_SERVICE_ID" --format '{{.ID}}')"
          test "$running_ids" = "$PG_SERVICE_ID"
          inspect_json="$(docker inspect "$PG_SERVICE_ID")"
          pgdata="$(docker exec "$PG_SERVICE_ID" printenv PGDATA)"
          test -n "$pgdata"
          printf '%s' "$inspect_json" | PGDATA="$pgdata" python -c '
          import json, os, re, sys
          containers = json.load(sys.stdin)
          assert len(containers) == 1, "service ID inspection was ambiguous"
          c = containers[0]
          assert c["Id"] == os.environ["PG_SERVICE_ID"], "service ID did not match inspected container"
          assert c["Config"]["Image"] == os.environ["PG_SERVICE_IMAGE"], "unexpected PostgreSQL service image"
          assert c["State"]["Running"], "PostgreSQL service is not running"
          assert not (c["HostConfig"].get("Binds") or c["HostConfig"].get("Mounts")), "explicit host mounts are forbidden"
          pgdata = os.environ["PGDATA"]
          for mount in c["Mounts"]:
              destination = mount["Destination"].rstrip("/") or "/"
              covers_data = pgdata == destination or pgdata.startswith(destination.rstrip("/") + "/")
              if not covers_data:
                  continue
              assert mount["Type"] == "volume", "persistent/bind PostgreSQL data mount is forbidden"
              assert c["Config"].get("Volumes", {}).get(destination) is not None, "mount is not image-declared ephemeral storage"
              name = mount.get("Name", "")
              source = mount.get("Source", "")
              assert re.fullmatch(r"[0-9a-f]{64}", name), "named or ambiguous PostgreSQL volume is forbidden"
              assert source.endswith("/volumes/" + name + "/_data"), "Docker volume ownership could not be verified"
          '
          system_identifier="$(docker exec "$PG_SERVICE_ID" pg_controldata "$pgdata" | awk -F ': *' '$1 ~ /Database system identifier/ { print $2 }')"
          [[ "$system_identifier" =~ ^[0-9]+$ ]]
          record_path="$RUNNER_TEMP/fardb-postgres-${{ matrix.postgres-version }}-ownership.json"
          python -m tests.integration.postgresql_disposable_cluster attest-job \
            --major "${{ matrix.postgres-version }}" --record "$record_path"
          printf 'PG_SERVICE_ID=%s\n' "$PG_SERVICE_ID" >> "$GITHUB_ENV"
          printf 'FARDB_EPHEMERAL_POSTGRES_CONTAINER_RECORD=%s\n' "$record_path" >> "$GITHUB_ENV"
          printf 'FARDB_EPHEMERAL_POSTGRES_SYSTEM_IDENTIFIER=%s\n' "$system_identifier" >> "$GITHUB_ENV"
          printf 'FARDB_EPHEMERAL_POSTGRES_INVOCATION_ID=%s-%s-pg%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "${{ matrix.postgres-version }}" >> "$GITHUB_ENV"

      - name: Build every profile twice and prove drift, relationship, and authority contracts
        env:
          FARDB_EPHEMERAL_POSTGRES_LEDGER_TESTS: "1"
          FARDB_EPHEMERAL_POSTGRES_AUTHORITY_TESTS: "1"
          FARDB_EPHEMERAL_POSTGRES_URL: postgresql://test:test@127.0.0.1:5432/test_db?sslmode=disable
          FARDB_POSTGRES_TEST_URL: postgresql://test:test@127.0.0.1:5432/test_db?sslmode=disable
          SECRET_KEY: ci-grac-schema-test-key-not-a-real-secret
          DATABASE_URL: sqlite:///./ci-auth.db
        run: |
          set -euo pipefail
          test -n "$PG_SERVICE_ID"
          test -n "$FARDB_EPHEMERAL_POSTGRES_SYSTEM_IDENTIFIER"
          test -n "$FARDB_EPHEMERAL_POSTGRES_CONTAINER_RECORD"
          test -n "$FARDB_EPHEMERAL_POSTGRES_INVOCATION_ID"
          python -m pytest tests/integration/test_postgresql_ledger_profiles.py tests/integration/test_postgres_runtime_capability_sql.py tests/integration/test_runtime_authority_postgres.py -v -rs

  postgres-ledger-container-boundary:
    name: PostgreSQL ledger container boundary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build runtime image without migration authority
        run: |
          docker build --target runtime --tag fardb-runtime:test --file Dockerfile.api .
          docker run --rm --entrypoint sh fardb-runtime:test -c \
            'test ! -e /app/supabase && test ! -e /app/scripts/postgresql_ledger.py && test ! -e /usr/local/bin/supabase'

      - name: Build pinned operator image with exact ledger
        run: |
          docker build --target migration --tag fardb-migration:test --file Dockerfile.api .
          docker run --rm --entrypoint sh fardb-migration:test -c \
            'test "$(supabase --version)" = "2.114.0" && python -m scripts.postgresql_ledger validate'

  security:
    name: Security checks
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run CI common for security checks (Python 3.11)
        uses: ./.github/actions/ci-common
        with:
          language: python
          python-version: "3.11"
          dependency-paths: |
            requirements.txt
            requirements-ci-security.txt
          install: |
            python -m pip --version
            pip install -r requirements.txt
            # Freeze resolved runtime packages (direct + transitive) before
            # installing CI security tooling, so Safety can scan the installed
            # runtime set without also covering safety/bandit toolchains.
            pip freeze > .ci-runtime-freeze.txt
            # Keep the scanners in an isolated environment so their transitive
            # dependencies cannot collide with the installed runtime set.
            python -m venv "$RUNNER_TEMP/fardb-security-venv"
            "$RUNNER_TEMP/fardb-security-venv/bin/python" -m pip install \
              --require-hashes -r requirements-ci-security.txt
          test: |
            echo "===== Safety ====="
            "$RUNNER_TEMP/fardb-security-venv/bin/safety" \
              check -r .ci-runtime-freeze.txt --policy-file .safety-policy.json --json

            echo "===== Bandit ====="
            "$RUNNER_TEMP/fardb-security-venv/bin/bandit" -r src/ -ll

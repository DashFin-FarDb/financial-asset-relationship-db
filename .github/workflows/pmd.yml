# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: pmd

"on":
  push:
    branches: ["main", "Default"]
    paths:
      - "**/*.java"
      - "pom.xml"
      - "build.gradle"
      - "build.gradle.kts"
      - ".github/workflows/pmd.yml"
      - "!**/*.md"
      - "!docs/**"
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["main"]
    paths:
      - "**/*.java"
      - "pom.xml"
      - "build.gradle"
      - "build.gradle.kts"
      - ".github/workflows/pmd.yml"
      - "!**/*.md"
      - "!docs/**"
  schedule:
    - cron: "15 23 * * 3"

permissions:
  contents: read

jobs:
  pmd-code-scan:
    concurrency:
      group: pmd-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1  # guardrails-disable-line
      - name: Set up JDK 11
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0  # guardrails-disable-line
        with:
          java-version: "11"
          distribution: "temurin"
      - name: Run PMD
        id: pmd
        uses: pmd/pmd-github-action@d9c1f3c5940cbf5923f1354e83fa858b4496ebaa # guardrails-disable-line
        with:
          rulesets: "rulesets/java/quickstart.xml"
          sourcePath: "src/main/java"
          analyzeModifiedFilesOnly: false
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.4  # guardrails-disable-line
        with:
          sarif_file: pmd-report.sarif

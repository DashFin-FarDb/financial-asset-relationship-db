name: PR Copilot Agent

# On-demand, read-only PR status reporting. No commit, review, or check-suite fan-out.

"on":
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to inspect
        required: true
        type: string

permissions:
  contents: none

concurrency:
  group: pr-copilot-${{ github.event_name }}-${{ inputs.pr_number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  status-update:
    name: Status Update
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        ) &&
        (
          github.event.comment.body == '@pr-copilot status update' ||
          github.event.comment.body == '@pr-copilot progress report' ||
          github.event.comment.body == '@pr-copilot show status' ||
          github.event.comment.body == '@pr_copilot status update' ||
          github.event.comment.body == '@pr_copilot progress report' ||
          github.event.comment.body == '@pr_copilot show status'
        )
      )
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
      statuses: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1  # guardrails-disable-line
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0  # guardrails-disable-line
        with:
          python-version: "3.11"

      - name: Capture PR head before report generation
        id: pr_head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.issue.number }}
        run: |
          HEAD_SHA=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq .head.sha)
          echo "sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"

      - name: Generate status report
        id: status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.issue.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          pip install -r .github/pr-copilot/scripts/requirements.txt
          python .github/pr-copilot/scripts/generate_status.py

      - name: Publish exact-head workflow summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.issue.number }}
          EXPECTED_HEAD_SHA: ${{ steps.pr_head.outputs.sha }}
        run: |
          CURRENT_HEAD_SHA=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq .head.sha)
          if [ "${CURRENT_HEAD_SHA}" != "${EXPECTED_HEAD_SHA}" ]; then
            echo "> Stale report discarded: PR head changed from \`${EXPECTED_HEAD_SHA}\` to \`${CURRENT_HEAD_SHA}\` during generation." >> "$GITHUB_STEP_SUMMARY"
            echo "PR head changed during report generation; refusing to publish stale status." >&2
            exit 1
          fi
          {
            echo "> Exact-head advisory snapshot for \`${EXPECTED_HEAD_SHA}\`. This is not merge authorization; unresolved threads, provider failures, dependency overlap, and maintainer approval still require reconciliation."
            echo
            cat /tmp/pr_status_report.md
          } | tee pr-copilot-status.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload short-lived status report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-copilot-status-${{ inputs.pr_number || github.event.issue.number }}-${{ github.run_id }}
          path: pr-copilot-status.md
          retention-days: 7

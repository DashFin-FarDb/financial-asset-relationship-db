name: OSSAR

"on":
  push:
    branches: ["main", "Default"]
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - ".github/workflows/ossar.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["main"]
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - ".github/workflows/ossar.yml"
  schedule:
    - cron: "29 3 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ossar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  OSSAR-Scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Bandit
        run: python -m pip install --disable-pip-version-check "bandit[sarif,toml]==1.8.6"

      - name: Run Bandit
        run: >-
          bandit
          --recursive .
          --configfile pyproject.toml
          --format sarif
          --output bandit-results.sarif
          --exit-zero

      - name: Upload Bandit results
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: bandit-results.sarif
          category: bandit

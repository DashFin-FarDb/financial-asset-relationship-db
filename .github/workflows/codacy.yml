# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow checks out code, performs a Codacy security scan
# and integrates the results with the
# GitHub Advanced Security code scanning feature.  For more information on
# the Codacy security scan action usage and parameters, see
# https://github.com/codacy/codacy-analysis-cli-action.
# For more information on Codacy Analysis CLI in general, see
# https://github.com/codacy/codacy-analysis-cli.

name: Codacy Security Scan

"on":
  push:
    branches: ["main", "Default"]
    paths:
      - "**/*.py"
      - "**/*.js"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.jsx"
      - "**/*.java"
      - "**/*.go"
      - "**/*.rb"
      - "**/*.php"
      - "**/*.swift"
      - "**/*.cs"
      - "**/*.c"
      - "**/*.cpp"
      - "**/*.h"
      - "**/*.hpp"
      - ".github/workflows/codacy.yml"
      - "!**/*.md"
      - "!docs/**"
  pull_request:
    types: [opened, synchronize, reopened]
    # The branches below must be a subset of the branches above
    branches: ["main"]
    paths:
      - "**/*.py"
      - "**/*.js"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.jsx"
      - "**/*.java"
      - "**/*.go"
      - "**/*.rb"
      - "**/*.php"
      - "**/*.swift"
      - "**/*.cs"
      - "**/*.c"
      - "**/*.cpp"
      - "**/*.h"
      - "**/*.hpp"
      - ".github/workflows/codacy.yml"
      - "!**/*.md"
      - "!docs/**"
  schedule:
    - cron: "26 15 * * 3"

permissions:
  contents: read

jobs:
  codacy-security-scan:
    concurrency:
      group: codacy-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Codacy Analysis CLI
        # Codacy CLI can still crash in SARIF post-process (MalformedInputException)
        # even on a clean UTF-8 tree. Continue to the validation/upload boundary so
        # useful SARIF can still be published, then fail closed on any scan error.
        id: codacy
        continue-on-error: true
        # CLI 7.10.1, including its runtime, is digest-pinned; no launcher is downloaded.
        # Remote rule metadata and downstream analyser images are not pinned by this digest.
        # The Docker socket retains high authority on this disposable hosted runner only.
        shell: bash
        env:
          CODACY_CODE: ${{ github.workspace }}
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
          CODACY_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          docker run \
            --rm \
            --env CODACY_CODE \
            --env CODACY_PROJECT_TOKEN \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$CODACY_CODE:$CODACY_CODE" \
            --volume /tmp:/tmp \
            codacy/codacy-analysis-cli@sha256:d412b2a84e72d0b541e29dd6cdffa78a73afcf35d8aa546988cd2a44edaab15c -- \
            analyze \
            --directory "$CODACY_CODE" \
            --skip-commit-uuid-validation \
            --commit-uuid "$CODACY_COMMIT_SHA" \
            --verbose \
            --output "$CODACY_CODE/results.sarif" \
            --format sarif \
            --gh-code-scanning-compat \
            --max-allowed-issues 2147483647 \
            --fail-if-incomplete

      - name: Validate SARIF results file
        id: validate_sarif
        if: hashFiles('results.sarif') != ''
        run: python -m json.tool results.sarif > /dev/null

      # Upload the SARIF file generated in the previous step
      - name: Upload SARIF results file
        if: hashFiles('results.sarif') != '' && steps.validate_sarif.outcome == 'success'
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: results.sarif

      - name: Fail when Codacy produced no SARIF
        if: always() && hashFiles('results.sarif') == ''
        run: |
          echo "::error::Codacy produced no results.sarif"
          exit 1

      - name: Fail when Codacy analysis failed
        if: always() && steps.codacy.outcome == 'failure'
        run: |
          echo "::error::Codacy analysis exited non-zero"
          exit 1

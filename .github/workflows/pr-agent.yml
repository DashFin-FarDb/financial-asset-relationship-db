name: PR Agent Workflow

permissions:
  contents: read

"on":
  issue_comment:
    types: [created]

jobs:
  pr-agent-action:
    permissions:
      contents: read
      pull-requests: read
      issues: write
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@copilot')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1  # guardrails-disable-line
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0  # guardrails-disable-line
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0  # guardrails-disable-line
        with:
          node-version: "18"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Install Node dependencies
        working-directory: ./frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "Warning: No package.json found in frontend directory"
            exit 1
          fi

      - name: Parse PR Context
        id: pr-context
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ] && [ -z "${{ github.event.issue.pull_request.url }}" ]; then
            echo "pr_data={}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PR_NUMBER="${{ github.event.pull_request.number || github.event.issue.number }}"
          PR_DATA=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" \
            --jq '{number: .number, title: .title, changed_files: .changed_files}')
          echo "pr_data=${PR_DATA}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Python Linting
        run: |
          python -m flake8 --max-line-length=120 --extend-ignore=E203,W503 api/ src/
          python -m black --check api/ src/

      - name: Run Python Tests
        run: |
          python -m pytest tests/ -v --cov=src --cov-report=term-missing

      - name: Run Frontend Linting
        working-directory: ./frontend
        run: |
          npm run lint
          npm run type-check

      - name: Run Frontend Tests
        working-directory: ./frontend
        run: npm test -- --coverage --watchAll=false

      - name: Create PR Comment
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0  # guardrails-disable-line
        with:
          script: |
            const workflowStatus = '${{ job.status }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🤖 PR Agent on-demand run finished with workflow status: **${workflowStatus}**.\n\nThis result is advisory and does not assert merge readiness.`
            });

  auto-merge-check:
    permissions:
      contents: read
    if: ${{ false }}
    runs-on: ubuntu-latest

    steps:
      - name: Explain disabled merge automation
        run: echo "Use the exact-head PR Copilot status report and maintainer reconciliation; automatic merge claims are disabled."

  dependency-update:
    permissions:
      contents: read
    if: ${{ false }}
    runs-on: ubuntu-latest

    steps:
      - name: Explain disabled dependency automation
        run: echo "Dependency updates require compatibility, overlap, and exact-head review; automatic approval is disabled."
